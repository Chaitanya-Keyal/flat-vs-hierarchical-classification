[project]
name = "flat-vs-hierarchical-classification"
version = "0.1.0"
description = "BITS F464 Assignment 1 - flat vs. hierarchical classification of frog calls with decision trees, ensembles and naive Bayes, from scratch"
requires-python = ">=3.12"

# The submitted scripts import only these two (and the standard library).
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
]

[dependency-groups]
# Tests, lint and formatting; uv installs this group by default.
dev = ["pytest>=8", "ruff>=0.17"]
# The demo notebook (notebooks/demo.ipynb), which only calls the part scripts.
notebook = ["jupyterlab>=4", "matplotlib>=3.8"]

[tool.uv]
# The repo is run in place, not installed as a package.
package = false

[tool.ruff]
line-length = 100
# uv pins 3.12 for the repo, but the submitted scripts must also run on older Pythons.
target-version = "py39"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, modern syntax, likely bugs, simplifications,
# comprehensions, naming, ruff's own rules.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "PIE", "RET", "PTH", "N", "RUF"]
# X, N, K, T and friends follow the handout's notation.
ignore = ["N803", "N806"]

[tool.ruff.lint.per-file-ignores]
# The notebook puts the repo root on sys.path before it can import the parts.
"notebooks/*" = ["E402"]

[tool.pytest.ini_options]
# The part scripts and common.py sit at the repo root and are imported from there.
pythonpath = ["."]
testpaths = ["tests"]
